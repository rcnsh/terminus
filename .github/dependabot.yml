# Keeps the pinned GitHub Actions (by commit SHA), the npm dev dependencies,
# the Android app's Gradle dependencies and the Mac app's Swift packages
# current: a PR per ecosystem when there's something new, a week at a time.
#
# Every ecosystem has a cooldown: a new release sits a few days first, as a
# compromised version is usually caught and pulled within that.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Conventional Commits, as every commit here: "ci(deps): bump ...".
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
    # "chore(deps): bump ...".
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 5
  # The version catalog (gradle/libs.versions.toml), the build scripts and
  # the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
    # "build(deps): bump ...".
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 5
  # Package.swift and Package.resolved (Sparkle); CI builds with exactly
  # the resolved versions.
  - package-ecosystem: swift
    directory: /apps/macos
    schedule:
      interval: weekly
    groups:
      mac:
        patterns: ["*"]
    # "build(deps): bump ...".
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 5
