# Keeps the pinned GitHub Actions (by commit SHA) and the npm dev
# dependencies current: a PR when there's something new, a week at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Conventional Commits, as every commit here: "ci(deps): bump ...".
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
    # "chore(deps): bump ...".
    commit-message:
      prefix: chore
      include: scope
    # Let a new release sit a few days first: a compromised version is
    # usually caught and pulled within that.
    cooldown:
      default-days: 5
