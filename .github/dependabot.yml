version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 5
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 5
  - package-ecosystem: swift
    directory: /apps/macos
    schedule:
      interval: weekly
    groups:
      mac:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 5
