# The street map's files onto R2 (scripts/map-tiles.sh). Run by hand from the
# Actions tab, or let it refresh itself twice a year for new buildings and
# paths. Runs in the `release` environment, which waits for a reviewer
# (the schedule too). The CLOUDFLARE_API_TOKEN secret is meant to live in
# that environment, not the repository; CLOUDFLARE_ACCOUNT_ID is a variable
# and not secret.
name: map tiles

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which site's bucket: stable, beta or both"
        type: choice
        options: [both, stable, beta]
        default: both
  schedule:
    # 04:13 UTC on 1 January and 1 July.
    - cron: "13 4 1 1,7 *"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The R2 token should be a secret of this environment: only jobs that
    # name it, and a reviewer approves, can read it. As a repository secret
    # every workflow could.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      # The token only in this step, not in pnpm install's lifecycle scripts.
      - name: Build and upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # The schedule has no inputs: both sites.
          CHANNEL: ${{ inputs.channel || 'both' }}
        run: scripts/map-tiles.sh
