# The street map's files onto R2 (scripts/map-tiles.sh). Run by hand from the
# Actions tab, or let it refresh itself twice a year for new buildings and
# paths. Uses the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID
# variable the release workflow uses, from the same environment.
name: map tiles

on:
  workflow_dispatch:
  schedule:
    # 04:13 UTC on 1 January and 1 July.
    - cron: "13 4 1 1,7 *"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    # Where the release workflow's R2 token lives (an environment secret
    # there; a repository secret is visible here too).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      # The token only in this step, as in the release workflow.
      - name: Build and upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/map-tiles.sh
