# ONE-OFF (step 2 of the redesign in HANDOFF.md; delete once watched): the web
# app's tabs (Now, Map, Settings) against the dev stub, recorded in WebKit with
# an iPhone profile (Playwright, Linux) and in Mobile Safari on an iOS
# Simulator (safaridriver, macOS). The videos are the runs' artifacts.
name: web tabs video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/web-tabs-video.yml]

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dev stub
        run: |
          nohup node apps/api/scripts/dev-stub.mjs > stub.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8787/ && exit 0; sleep 1; done
          cat stub.log; exit 1
      - name: Playwright WebKit
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps webkit
      - name: Record
        run: |
          cat > "$RUNNER_TEMP/pw/tabs.mjs" <<'EOF'
          import { webkit, devices } from 'playwright';
          const fail = (e) => { console.log(`::error::${String(e?.message ?? e).replace(/\n/g, ' ')}`); process.exit(1); };
          process.on('uncaughtException', fail);
          process.on('unhandledRejection', fail);
          const b = await webkit.launch();
          const ctx = await b.newContext({ ...devices['iPhone 15'], recordVideo: { dir: 'video', size: { width: 393, height: 659 } } });
          const p = await ctx.newPage();
          const errors = [];
          p.on('pageerror', (e) => errors.push(e.message));
          await p.goto('http://localhost:8787/account/?next=/app/');
          await p.tap('#no-email');
          await p.getByText('Skip setup').tap();
          await p.waitForURL('**/app/**');
          await p.waitForSelector('#preview .big, #preview .detail');
          await p.waitForTimeout(1500);
          const tab = async (n, ms) => { await p.tap(`.tabbar a[data-tab="${n}"]`); await p.waitForTimeout(ms); };
          await tab('map', 4000);
          await tab('settings', 2500);
          await p.evaluate(() => window.scrollTo({ top: 900, behavior: 'smooth' })); await p.waitForTimeout(1500);
          await p.selectOption('#pace', 'fast'); await p.waitForTimeout(1500);
          await tab('now', 2000);
          await tab('settings', 2000);
          const kept = await p.evaluate(() => scrollY);
          await tab('map', 2500);
          await tab('now', 2000);
          await tab('settings', 2000);
          await p.screenshot({ path: 'video/last.png' });
          await ctx.close(); await b.close();
          console.log(`::notice::WebKit: settings scroll kept at ${kept}; page errors: ${errors.join(' | ') || 'none'}`);
          EOF
          cd "$RUNNER_TEMP/pw" && node tabs.mjs && mv video "$GITHUB_WORKSPACE/webkit-video"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-video
          path: |
            webkit-video
            stub.log
          if-no-files-found: warn

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dev stub
        run: |
          nohup node apps/api/scripts/dev-stub.mjs > stub.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8787/ && exit 0; sleep 1; done
          cat stub.log; exit 1
      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for rt, devs in json.load(sys.stdin)["devices"].items():
              if "iOS" in rt:
                  for d in devs:
                      if d["name"].startswith("iPhone 16") and "Pro" not in d["name"] and "Plus" not in d["name"]: print(d["udid"]); sys.exit()
          ')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          # Simulators from iOS 14 always allow remote automation; the Mac needs it on.
          sudo safaridriver --enable
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          # Safari opened once, so safaridriver finds it running.
          xcrun simctl openurl "$udid" http://localhost:8787/
          sleep 15
      - name: Record
        run: |
          cat > sim.mjs <<'EOF'
          import { spawn } from 'node:child_process';
          const fail = (e) => { console.log(`::error::${String(e?.message ?? e).replace(/\n/g, ' ')}`); process.exit(1); };
          process.on('uncaughtException', fail);
          process.on('unhandledRejection', fail);
          const D = 'http://localhost:4444';
          const call = async (method, path, body) => {
            const r = await fetch(D + path, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
            const j = await r.json();
            if (!r.ok) throw new Error(`${method} ${path}: ${JSON.stringify(j.value)}`);
            return j.value;
          };
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          // The first try often times out on CI runners (actions/runner-images#1453).
          let s;
          for (let i = 1; !s; i++) {
            try {
              ({ sessionId: s } = await call('POST', '/session', { capabilities: { alwaysMatch: { browserName: 'safari', platformName: 'iOS', 'safari:useSimulator': true, 'safari:deviceUDID': process.env.UDID } } }));
            } catch (e) {
              console.log(`::warning::session try ${i}: ${e.message}`);
              if (i === 5) throw e;
              await sleep(5000);
            }
          }
          const run = (script) => call('POST', `/session/${s}/execute/sync`, { script, args: [] });
          const find = async (sel, using = 'css selector') => {
            for (let i = 0; i < 40; i++) {
              try { return Object.values(await call('POST', `/session/${s}/element`, { using, value: sel }))[0]; } catch { await sleep(500); }
            }
            const seen = await run('return location.href + " :: " + document.body.innerText.slice(0, 300)').catch(() => '');
            throw new Error(`not found: ${sel} (on ${seen})`);
          };
          const click = async (sel, using) => call('POST', `/session/${s}/element/${await find(sel, using)}/click`, {});
          await call('POST', `/session/${s}/url`, { url: 'http://localhost:8787/account/?next=/app/' });
          // Once the page's script has wired the button: tapped until setup shows.
          await sleep(3000);
          for (let i = 0; i < 5 && !(await run("return !!document.querySelector('#onboarding:not([hidden])')")); i++) {
            await click('#no-email');
            await sleep(2000);
          }
          await click("//button[contains(., 'Skip setup')]", 'xpath');
          await find('#preview .big, #preview .detail');
          await sleep(2000);
          const rec = spawn('xcrun', ['simctl', 'io', process.env.UDID, 'recordVideo', '--codec=h264', '--force', 'ios-simulator.mp4'], { stdio: 'inherit' });
          await sleep(3000);
          const tab = async (n, ms) => { await click(`.tabbar a[data-tab="${n}"]`); await sleep(ms); };
          await tab('map', 5000);
          await tab('settings', 3000);
          await run("window.scrollTo({ top: 900, behavior: 'smooth' })"); await sleep(2000);
          await tab('now', 2500);
          await tab('settings', 2500);
          const kept = await run('return scrollY');
          await tab('map', 3000);
          await tab('now', 2500);
          await tab('settings', 2500);
          rec.kill('SIGINT');
          await new Promise((r) => rec.on('exit', r));
          await call('DELETE', `/session/${s}`);
          console.log(`::notice::iOS Simulator: settings scroll kept at ${kept}`);
          EOF
          safaridriver -p 4444 &
          sleep 10
          node sim.mjs
      - if: failure()
        run: xcrun simctl io "$UDID" screenshot failed.png || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-video
          path: |
            ios-simulator.mp4
            failed.png
            stub.log
          if-no-files-found: warn
