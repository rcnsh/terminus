name: release

# Pushing a v* tag (after scripts/release.sh has built and uploaded the APK)
# builds the Mac app, signs it with the terminus self-signed certificate,
# packages it as a DMG, uploads it to R2, writes the Sparkle appcast that
# installed Mac apps update from, points latest.json at the new version and
# publishes the GitHub release with the APK and the DMG.
#
# Run by hand (Actions > release > Run workflow) it only builds, signs and
# packages, and keeps the DMG as a workflow artifact: a check on signing that
# publishes nothing.
#
# Not notarised: that needs a paid Apple Developer account. Gatekeeper asks
# once on first open, as the install steps say.

# Betas (v2.0.1-beta.1) are released from this Mac by scripts/release-beta.sh,
# which pushes their tag too: they don't run this.
on:
  push:
    tags: ["v*", "!v*-beta.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  mac:
    # Run by hand only from main: a branch could change what runs with the
    # signing key. Tags are checked against main below.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    # The signing key, the Sparkle key and the R2 token live in this
    # environment, which waits for a reviewer's approval before the job runs.
    environment: release
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      # The R2 token is only in the publish step's env: not in pnpm install's
      # lifecycle scripts, the Swift build or third-party actions.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # SHA-1 of the terminus self-signed certificate (~/.terminus/mac-signing.p12).
      # Signing by hash rather than name, as the certificate isn't trusted.
      SIGN_IDENTITY: C4EE234DA75ED3CD7699A31394C276801F93C4A9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes list the commits since the previous tag.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Version
        id: v
        env:
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
          HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          MAC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/macos/Support/Info.plist)
          ANDROID=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' apps/android/app/build.gradle.kts)
          [ "$MAC" = "$ANDROID" ] || { echo "::error::Mac is $MAC but Android is $ANDROID"; exit 1; }
          MAC_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' apps/macos/Support/Info.plist)
          ANDROID_BUILD=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' apps/android/app/build.gradle.kts | head -1)
          [ "$MAC_BUILD" = "$ANDROID_BUILD" ] || { echo "::error::Mac build is $MAC_BUILD but Android versionCode is $ANDROID_BUILD"; exit 1; }
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF_NAME" != "v$MAC" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $MAC"; exit 1
          fi
          # Only release what's on main: a tag on another branch is refused.
          if [ "$PUBLISH" = true ]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
          fi
          if [ "$PUBLISH" = true ] && [ "$HAS_CLOUDFLARE_TOKEN" != true ]; then
            echo "::error::the CLOUDFLARE_API_TOKEN secret is not set"; exit 1
          fi
          if [ "$PUBLISH" = true ] && [ "$HAS_SPARKLE_KEY" != true ]; then
            echo "::error::the SPARKLE_ED_PRIVATE_KEY secret is not set"; exit 1
          fi
          echo "version=$MAC" >> "$GITHUB_OUTPUT"

      - name: Signing keychain
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 16)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          # On the search list too: some codesign versions only find identities there.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Self-signed, so listed as not trusted; codesign signs with it all the same.
          security find-identity -p codesigning "$KC" | grep -q "$SIGN_IDENTITY" || {
            echo "::error::the certificate $SIGN_IDENTITY is not in MAC_SIGNING_P12"; exit 1; }
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build, sign and package
        run: scripts/package-mac.sh

      - name: Keep the DMG
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminus-${{ steps.v.outputs.version }}-dmg
          path: build/release/${{ steps.v.outputs.version }}/terminus-${{ steps.v.outputs.version }}.dmg

      - name: Upload to R2, write the appcast, update latest.json
        if: env.PUBLISH == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: scripts/publish-mac.sh "$VERSION"

      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: scripts/github-release.sh "$VERSION"

      - name: Remove the signing keychain
        if: always()
        run: if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN"; fi
