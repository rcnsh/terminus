name: probe arrivals feed

# Run by hand (Actions > probe arrivals feed > Run workflow) while buses run:
# measures how often the feed's arrival times change, to see what the 15 s
# arrivals cache hides. A temporary, bounded test (probe_arrivals.py has the
# limits); the result is the run's summary.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to poll (at most 15)"
        default: "10"
      stops:
        description: "Stop codes, space-separated (at most 4)"
        default: "COM3 UTOWN KR-MRT PGP"
      every:
        description: "Seconds between polls of each stop (at least 5)"
        default: "5"
      trace:
        description: "Also print every reading (no plates) to the log"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Its own guest token: no NEXTBUS_DEVICE_ID, so it mints with a fresh
      # random device id and a refusal here can't touch the Worker's.
      - name: Probe
        env:
          NEXTBUS_AUTH_BASE: ${{ secrets.NEXTBUS_AUTH_BASE }}
          NEXTBUS_APP_VERSION: ${{ secrets.NEXTBUS_APP_VERSION }}
          NEXTBUS_HTD_API: ${{ secrets.NEXTBUS_HTD_API }}
          NEXTBUS_APP_API: ${{ secrets.NEXTBUS_APP_API }}
          NEXTBUS_PROXY_BASE: ${{ secrets.NEXTBUS_PROXY_BASE }}
          NEXTBUS_PROXY_API_KEY: ${{ secrets.NEXTBUS_PROXY_API_KEY }}
          MINUTES: ${{ inputs.minutes }}
          STOPS: ${{ inputs.stops }}
          EVERY: ${{ inputs.every }}
          TRACE: ${{ inputs.trace }}
        working-directory: apps/api/scripts
        # STOPS unquoted on purpose: one argument per stop. Each must be a
        # plain stop code, so the input can't pass an option (or a glob);
        # after `--` too, and probe_arrivals.py checks again.
        run: |
          set -f
          for s in $STOPS; do
            case "$s" in
              *[!A-Z0-9-]*|-*) echo "::error::not a stop code: $s"; exit 1 ;;
            esac
          done
          if [ "$TRACE" = true ]; then set -- --trace trace.jsonl; fi
          status=0
          python3 probe_arrivals.py --minutes "$MINUTES" --every "$EVERY" "$@" -- $STOPS > report.md || status=$?
          if [ "$TRACE" = true ] && [ -f trace.jsonl ]; then echo "--- trace ---"; cat trace.jsonl; echo "--- end trace ---"; fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # Also as one annotation, readable through the API without the logs.
          python3 -c 'import sys; t = sys.stdin.read().replace("%", "%25").replace("\r", "").replace("\n", "%0A"); print("::notice title=probe::" + t)' < report.md
          exit "$status"
