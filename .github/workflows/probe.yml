# ONE-OFF (Phase 1 of docs/map-plan.md; delete after): a dry run of
# scripts/map-tiles.sh, since the Protomaps build can't be reached from the
# build container. Builds the map files and uploads nothing.
name: map tiles dry run

on:
  push:
    branches: [ccr-6bfb8175-pou0tm]
    paths: [scripts/map-tiles.sh, .github/workflows/probe.yml]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/map-tiles.sh --dry-run
      - run: ls -la build/map build/map/sprites/v4 && du -sh build/map/fonts/*
