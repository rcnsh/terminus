name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Tests and typecheck, then a dry-run bundle: catches a module workerd
      # would refuse to load, which the Node tests cannot see.
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir /tmp/dist
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # No build step for the site: a syntax error would only show in a browser.
      - run: for f in $(find apps/web/public -name '*.js'); do node --check "$f" || exit 1; done

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Lint and the JVM unit tests (which parse apps/api/test/fixtures/answers).
      # Release signing isn't needed: debug tasks only.
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest --console=plain
        working-directory: apps/android

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build && swift test
        working-directory: apps/macos
