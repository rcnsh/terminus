name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR replaces its run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests and typecheck, then a dry-run bundle: catches a module workerd
      # would refuse to load, which the Node tests cannot see.
      - run: pnpm check
      - run: pnpm exec cf deploy --dry-run
        working-directory: apps/api

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Oxfmt, by .oxfmtrc.json: JS, TS and JSON.
      - run: pnpm format:check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # No build step for the site: a syntax error would only show in a browser.
      - run: for f in $(find apps/web/public -name '*.js'); do node --check "$f" || exit 1; done

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Lint and the JVM unit tests (which parse apps/api/test/fixtures/answers).
      # ktfmtCheck: the Kotlin is formatted (ktfmt, by apps/android/.editorconfig).
      - run: ./gradlew :app:ktfmtCheck :app:lintStableDebug :app:testStableDebugUnitTest :app:compileBetaDebugKotlin --console=plain
        working-directory: apps/android

  # What release.sh and release-beta.sh ship: R8 and resource shrinking run
  # only here, so a missing keep rule would otherwise first show in a released
  # app. A job per flavour, beside the checks above: the release builds share
  # no compiled code with them or each other, so running them one after
  # another only added up the minutes. With no keystore on the runner, both
  # come out unsigned; the beta takes the default version without -PbetaVersion.
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavour: [Stable, Beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew :app:assemble${{ matrix.flavour }}Release --console=plain
        working-directory: apps/android

  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # MapLibre is a committed binary, linked into the app: a changed zip
      # must come with a changed hash, in the same reviewed diff.
      - run: shasum -a 256 -c MapLibre.xcframework.zip.sha256
        working-directory: apps/macos/Vendor
      # The Swift is formatted (swift-format, by .swift-format).
      - run: scripts/format-swift.sh --check
      # Exactly the versions in Package.resolved: a package that moved its
      # tag, or a stale lock file, fails here rather than resolving afresh.
      - run: swift build --force-resolved-versions && swift test --force-resolved-versions
        working-directory: apps/macos
      # The optimised build that build.sh (and so a release) makes, with its
      # flags: the debug build can pass where it fails.
      - run: swift build -c release --arch arm64 --force-resolved-versions
        working-directory: apps/macos

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every phrase the app writes has its Chinese.
      - run: python3 -I scripts/strings.py --check
        working-directory: apps/ios
      # MapLibre's published iOS build, checked against its SHA-256 before it's unpacked.
      - run: scripts/fetch-maplibre.sh
        working-directory: apps/ios
      - run: brew install xcodegen && xcodegen generate
        working-directory: apps/ios
      # The unit tests on the newest iPhone simulator the runner has (the UI
      # tests need the dev stub and a person looking at their screenshots).
      # Signed ad hoc, which needs no certificate: an unsigned app has no
      # entitlements, so the simulator gives it no keychain at all.
      - name: unit tests
        working-directory: apps/ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -I -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          xcodebuild test -project terminus.xcodeproj -scheme Terminus -destination "id=$SIM" -only-testing:TerminusTests CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -quiet
      # The optimised build a release would make, for a device, unsigned.
      - run: xcodebuild build -project terminus.xcodeproj -scheme Terminus -configuration Release -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO -quiet
        working-directory: apps/ios
      # What Xcode leaves running (the simulator, ibtoold), stopped here: left
      # to the runner's own clean-up, the job can sit unfinished for 40 minutes
      # after its last step.
      - name: stop the simulator and Xcode's helpers
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -9 -x ibtoold || true
