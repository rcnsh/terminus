name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR replaces its run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests and typecheck, then a dry-run bundle: catches a module workerd
      # would refuse to load, which the Node tests cannot see.
      - run: pnpm check
      - run: pnpm exec cf deploy --dry-run
        working-directory: apps/api

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # oxlint's default rules (correctness), over the API, its tests and
      # scripts, the website's scripts and the release scripts. Warnings fail.
      - run: pnpm lint

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # No build step for the site: a syntax error would only show in a browser.
      - run: for f in $(find apps/web/public -name '*.js'); do node --check "$f" || exit 1; done

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # Keeps the Gradle distribution, the dependencies, the configuration
      # cache and the build cache between runs; without it every run spent a
      # minute downloading and configuring before the first task. Only runs
      # on main write the cache; pull requests read it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Lint and the JVM unit tests (which parse apps/api/test/fixtures/answers).
      - run: ./gradlew :app:lintStableDebug :app:testStableDebugUnitTest :app:compileBetaDebugKotlin --console=plain
        working-directory: apps/android
      # What release.sh and release-beta.sh ship: R8 and resource shrinking
      # run only here, so a missing keep rule would otherwise first show in a
      # released app. With no keystore on the runner, both sign with the
      # debug key; the beta takes the default version without -PbetaVersion.
      - run: ./gradlew :app:assembleStableRelease :app:assembleBetaRelease --console=plain
        working-directory: apps/android

  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # MapLibre is a committed binary, linked into the app: a changed zip
      # must come with a changed hash, in the same reviewed diff.
      - run: shasum -a 256 -c MapLibre.xcframework.zip.sha256
        working-directory: apps/macos/Vendor
      # Exactly the versions in Package.resolved: a package that moved its
      # tag, or a stale lock file, fails here rather than resolving afresh.
      - run: swift build --force-resolved-versions && swift test --force-resolved-versions
        working-directory: apps/macos
      # The optimised build that build.sh (and so a release) makes, with its
      # flags: the debug build can pass where it fails.
      - run: swift build -c release --arch arm64 --force-resolved-versions
        working-directory: apps/macos
