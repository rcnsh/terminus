# ONE-OFF (Phase 3 of docs/map-plan.md; delete before the PR): the Map tab on
# an emulator with the real street map, screenshotted into the log
# (androidTest/MapShots.kt), since the build container has no SDK or emulator.
name: android map shots

on:
  push:
    branches: [ccr-6bfb8175-pou0tm]
    paths: [apps/android/app/src/androidTest/**, apps/android/app/src/main/java/sh/rcn/terminus/ui/MapScreen.kt, .github/workflows/android-shots.yml]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: apps/android
          script: |
            adb logcat -c
            ./gradlew :app:connectedStableDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=sh.rcn.terminus.MapShots --console=plain || true
            adb logcat -d -s MAPSHOT:I AndroidRuntime:E Mbgl:E MapLibre:E > shots.log || true
            grep -c MAPSHOT shots.log || true
            grep -v MAPSHOT shots.log | tail -60 || true
            grep MAPSHOT shots.log | sed 's/^.*MAPSHOT: //' || true
