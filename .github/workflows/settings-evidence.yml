# ONE-OFF (step 3 of the redesign in HANDOFF.md; delete once watched): the
# new Settings on an Android emulator against the dev stub, recorded opening
# groups and going back (the back gesture and the back key), and the Mac
# app's snapshot renders of each settings group. Both are the run's artifacts.
name: settings evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/settings-evidence.yml]

permissions:
  contents: read

jobs:
  android:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Dev stub
        run: |
          nohup node apps/api/scripts/dev-stub.mjs > stub.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8787/ && exit 0; sleep 1; done
          cat stub.log; exit 1
      - name: Debug app, pointed at the stub
        run: ./gradlew :app:assembleStableDebug -PapiBase=http://localhost:8787 --console=plain
        working-directory: apps/android
      # Taps by label: the tab bar's places are read once on the Now tab, as
      # uiautomator can't read the screen while the map is animating.
      - name: Recording script
        run: |
          cat > apps/android/tabs.sh <<'EOF'
          set -x
          adb reverse tcp:8787 tcp:8787
          adb install -r -g "$(ls app/build/outputs/apk/stable/debug/*x86_64*.apk | head -1)"
          adb shell monkey -p sh.rcn.terminus -c android.intent.category.LAUNCHER 1
          where() {
            for i in $(seq 1 40); do
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1
              xy=$(python3 - "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          try: root = ET.parse('ui.xml').getroot()
          except Exception: sys.exit()
          # The last match: the tab bar comes after the screen above it.
          hits = [n for n in root.iter('node') if n.get('text') == sys.argv[1]]
          if hits:
              a, b, c, d = map(int, re.findall(r'\d+', hits[-1].get('bounds')))
              print((a + c) // 2, (b + d) // 2)
          PY
          )
              [ -n "$xy" ] && { echo "$xy"; return 0; }
              sleep 1
            done
            echo "not found: $1" >&2; adb exec-out screencap -p > "missing-$1.png"; return 1
          }
          tap() { adb shell input tap $1; }
          xy=$(where 'Get started') || exit 1; tap "$xy"
          xy=$(where 'Skip setup') || exit 1; tap "$xy"
          SETTINGS=$(where 'Settings') || exit 1
          # Gesture navigation, so the back gesture (and its preview) can be shown.
          adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural || true
          sleep 3
          tap "$SETTINGS"
          sleep 3
          adb shell screenrecord --bit-rate 8000000 --time-limit 120 /sdcard/settings.mp4 &
          sleep 2
          open_row() { xy=$(where "$1") && tap "$xy"; sleep 2.5; }
          # A slow swipe in from the left edge: the page follows it, then goes.
          edge_back() { adb shell input swipe 2 1300 700 1300 900; sleep 2; }
          open_row 'Your trips'
          adb shell input swipe 540 1800 540 900 500; sleep 2
          edge_back
          open_row 'Notifications'
          adb shell input keyevent KEYCODE_BACK; sleep 2
          open_row 'Timetable'
          edge_back
          open_row 'Devices'
          adb shell input keyevent KEYCODE_BACK; sleep 2
          open_row 'Language'
          edge_back
          open_row 'Account'
          adb shell input keyevent KEYCODE_BACK; sleep 2
          adb exec-out screencap -p > list.png
          adb shell pkill -INT screenrecord
          sleep 4
          adb pull /sdcard/settings.mp4 settings.mp4
          adb exec-out screencap -p > last.png
          EOF
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # The point is to see the animations.
          disable-animations: false
          working-directory: apps/android
          script: bash tabs.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-settings-video
          path: |
            apps/android/settings.mp4
            apps/android/*.png
            stub.log
          if-no-files-found: warn

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Snapshots
        run: |
          mkdir -p shots
          set +e
          TERMINUS_SNAPSHOT="$PWD/shots" swift run > run.log 2>&1
          code=$?
          tail -25 run.log | sed 's/^/::notice::/'
          ls shots | head -50 | tr '\n' ' ' | sed 's/^/::notice::files: /'; echo
          exit $code
        working-directory: apps/macos
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-settings-snapshots
          path: apps/macos/shots
          if-no-files-found: warn
