# ONE-OFF (Phase 3 of docs/map-plan.md; delete after this check): the Android
# checks from ci.yml on pushes to this branch, since the build container has
# no Android SDK. Plus a debug build, to see the per-CPU APKs and their sizes.
name: android check

on:
  push:
    branches: [ccr-6bfb8175-pou0tm]
    paths: [apps/android/**, .github/workflows/android-check.yml]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew :app:lintStableDebug :app:testStableDebugUnitTest :app:compileBetaDebugKotlin :app:assembleStableRelease --console=plain
        working-directory: apps/android
      - if: always()
        run: ls -la apps/android/app/build/outputs/apk/stable/release/ 2>/dev/null || true
