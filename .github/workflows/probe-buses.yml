name: probe live-bus feed

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to poll"
        default: "3"
      services:
        description: "Services, space-separated (at most 6)"
        default: "A1 A2 D1 D2"
      every:
        description: "Seconds between polls of each service (at least 5)"
        default: "5"
      trace:
        description: "Also print every reading (no plates) to the log, for replaying"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Probe
        env:
          NEXTBUS_AUTH_BASE: ${{ secrets.NEXTBUS_AUTH_BASE }}
          NEXTBUS_APP_VERSION: ${{ secrets.NEXTBUS_APP_VERSION }}
          TERMINUS_SCRAPE_TOKEN: ${{ secrets.TERMINUS_SCRAPE_TOKEN }}
          NEXTBUS_HTD_API: ${{ secrets.NEXTBUS_HTD_API }}
          NEXTBUS_APP_API: ${{ secrets.NEXTBUS_APP_API }}
          NEXTBUS_PROXY_BASE: ${{ secrets.NEXTBUS_PROXY_BASE }}
          NEXTBUS_PROXY_API_KEY: ${{ secrets.NEXTBUS_PROXY_API_KEY }}
          MINUTES: ${{ inputs.minutes }}
          SERVICES: ${{ inputs.services }}
          EVERY: ${{ inputs.every }}
          TRACE: ${{ inputs.trace }}
        working-directory: apps/api/scripts/probes
        run: |
          set -f
          for s in $SERVICES; do
            case "$s" in
              *[!A-Za-z0-9]*) echo "::error::not a service name: $s"; exit 1 ;;
            esac
          done
          if [ "$TRACE" = true ]; then set -- --trace trace.jsonl; fi
          python3 probe_buses.py --minutes "$MINUTES" --every "$EVERY" "$@" -- $SERVICES > report.md
          if [ "$TRACE" = true ]; then echo "--- trace ---"; cat trace.jsonl; echo "--- end trace ---"; fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import sys; t = sys.stdin.read().replace("%", "%25").replace("\r", "").replace("\n", "%0A"); print("::notice title=probe::" + t)' < report.md
