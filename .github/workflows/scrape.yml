name: scrape stop graph

on:
  schedule:
    # 03:00 UTC Monday = 11:00 SGT Monday. Weekly is plenty: stop locations,
    # route order and operating hours change a few times a year.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config: the scrapers, the parsers of what
          # they fetch and the test suite's dependencies all run before the
          # commit, and none of them should be able to push to main. Only the
          # last step gets the token.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Same guest-token flow and bus proxy as the Worker (see apps/api/src/auth.ts).
      - name: Scrape
        env:
          NEXTBUS_AUTH_BASE: ${{ secrets.NEXTBUS_AUTH_BASE }}
          NEXTBUS_APP_VERSION: ${{ secrets.NEXTBUS_APP_VERSION }}
          NEXTBUS_HTD_API: ${{ secrets.NEXTBUS_HTD_API }}
          NEXTBUS_APP_API: ${{ secrets.NEXTBUS_APP_API }}
          NEXTBUS_PROXY_BASE: ${{ secrets.NEXTBUS_PROXY_BASE }}
          NEXTBUS_PROXY_API_KEY: ${{ secrets.NEXTBUS_PROXY_API_KEY }}
        run: python3 apps/api/scripts/scrape_stops.py

      # Each service's path along OpenStreetMap roads, for the map. Overpass is
      # often busy: on failure the committed shapes stay, and the API draws a
      # route whose stops changed as straight lines until next week.
      - name: Route shapes
        continue-on-error: true
        run: python3 apps/api/scripts/route_shapes.py

      # The public buses at the campus's stops, from LTA DataMall (free account
      # key, the LTA_ACCOUNT_KEY secret). Without the key, or with DataMall
      # down, the committed public.json stays.
      - name: Public buses
        continue-on-error: true
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: python3 apps/api/scripts/scrape_lta.py

      # Semester dates (NUSMods) and public holidays (MOM). No credentials.
      - name: Refresh calendar
        run: python3 apps/api/scripts/fetch_calendar.py

      # A bad graph is worse than a stale one, so the suite gates the commit.
      - name: Test against the new graph
        run: pnpm install --frozen-lockfile && pnpm test

      # Well-formed but wrong (stops gone, off-campus coordinates, a huge
      # file) is caught here: this pushes to main with no review.
      - name: Sanity-check against what's committed
        run: python3 apps/api/scripts/check_scraped.py

      - name: Commit if changed
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- apps/api/data/stops.json apps/api/data/calendar.json apps/api/data/shapes.json apps/api/data/public.json; then
            echo "stop graph, shapes, public buses and calendar unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/data/stops.json apps/api/data/calendar.json apps/api/data/shapes.json apps/api/data/public.json
          git commit -m "chore(data): refresh stop graph, shapes, public buses and calendar"
          # main may have moved during the scrape; the data files are only
          # changed here, so this rebases cleanly.
          # The same header actions/checkout would have stored, for these two
          # commands only.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth" pull --rebase origin main
          git -c http.https://github.com/.extraheader="$auth" push
