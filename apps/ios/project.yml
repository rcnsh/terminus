name: terminus
options:
  bundleIdPrefix: sh.rcn
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "3.12.0"
    CURRENT_PROJECT_VERSION: "73"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    TERMINUS_API: https://terminus.run
    TERMINUS_SITE: https://terminus.run
    TERMINUS_SUFFIX: ""
    TERMINUS_NAME: terminus
    APP_GROUP: group.sh.rcn.terminus
    LINK_SHOWN: terminus.run
  configs:
    Beta:
      TERMINUS_API: https://beta.terminus.run
      TERMINUS_SITE: https://beta.terminus.run
      TERMINUS_SUFFIX: .beta
      TERMINUS_NAME: terminus beta
      APP_GROUP: group.sh.rcn.terminus.beta
      LINK_SHOWN: beta.terminus.run
    Sideload:
      TERMINUS_SUFFIX: .sideload
      APP_GROUP: group.sh.rcn.terminus.sideload
configs:
  Debug: debug
  Release: release
  Beta: release
  Sideload: release
targets:
  Terminus:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/Widgets/LiveIntents.swift
      - path: Support/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Support
        includes: ["*.lproj/**"]
    dependencies:
      - target: TerminusWidgets
      - target: TerminusNotifications
      - target: TerminusWatch
      - framework: Vendor/MapLibre.xcframework
        embed: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: $(TERMINUS_NAME)
        CFBundleName: $(TERMINUS_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleAllowMixedLocalizations: true
        TerminusAPI: $(TERMINUS_API)
        TerminusSite: $(TERMINUS_SITE)
        TerminusGroup: $(APP_GROUP)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [sh.rcn.terminus.refresh]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: So directions start from your nearest stop. It's rounded to about 11 m and never saved on the server; the phone keeps the last one for 2 hours at most, for the widgets.
        NSCameraUsageDescription: To scan a pairing code from another device.
        CFBundleURLTypes:
          - CFBundleURLName: sh.rcn.terminus
            CFBundleURLSchemes: [terminus]
        LSApplicationQueriesSchemes: [comgooglemaps]
    entitlements:
      path: Support/Terminus.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.associated-domains: [applinks:$(LINK_SHOWN)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus$(TERMINUS_SUFFIX)
        PRODUCT_NAME: Terminus
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TERMINUS_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  TerminusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Shared
      - path: Support
        includes: ["*.lproj/**"]
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: $(TERMINUS_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans]
        TerminusAPI: $(TERMINUS_API)
        TerminusSite: $(TERMINUS_SITE)
        TerminusGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus$(TERMINUS_SUFFIX).widgets
        PRODUCT_NAME: TerminusWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
  TerminusNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NotificationService
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Shared
      - path: Support
        includes: ["*.lproj/**"]
    info:
      path: Support/Notifications-Info.plist
      properties:
        CFBundleDisplayName: $(TERMINUS_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans]
        TerminusAPI: $(TERMINUS_API)
        TerminusSite: $(TERMINUS_SITE)
        TerminusGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Support/Notifications.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus$(TERMINUS_SUFFIX).notifications
        PRODUCT_NAME: TerminusNotifications
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
  TerminusWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Watch/App
      - path: Sources/Watch/Common
      - path: Sources/Shared
      - path: Sources/App/Nearby/NearbyCells.swift
      - path: Sources/App/Model/Locator.swift
      - path: Support/Watch/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Support
        includes: ["*.lproj/**"]
        excludes: ["*.lproj/InfoPlist.strings"]
      - path: Support/Watch
        includes: ["*.lproj/**"]
    dependencies:
      - target: TerminusWatchWidgets
    info:
      path: Support/Watch-Info.plist
      properties:
        CFBundleDisplayName: $(TERMINUS_NAME)
        CFBundleName: $(TERMINUS_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleAllowMixedLocalizations: true
        TerminusAPI: $(TERMINUS_API)
        TerminusSite: $(TERMINUS_SITE)
        TerminusGroup: $(APP_GROUP)
        WKApplication: true
        WKCompanionAppBundleIdentifier: sh.rcn.terminus$(TERMINUS_SUFFIX)
        WKRunsIndependentlyOfCompanionApp: false
        NSLocationWhenInUseUsageDescription: So directions start from your nearest stop. It's rounded to about 11 m and never saved on the server; the watch keeps the last one for 2 hours at most, for its complications.
    entitlements:
      path: Support/Watch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus$(TERMINUS_SUFFIX).watchkitapp
        PRODUCT_NAME: TerminusWatch
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TERMINUS_WATCH
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  TerminusWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/Watch/Widgets
      - path: Sources/Watch/Common
      - path: Sources/Shared
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Support
        includes: ["*.lproj/**"]
        excludes: ["*.lproj/InfoPlist.strings"]
    info:
      path: Support/WatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: $(TERMINUS_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans]
        TerminusAPI: $(TERMINUS_API)
        TerminusSite: $(TERMINUS_SITE)
        TerminusGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus$(TERMINUS_SUFFIX).watchkitapp.widgets
        PRODUCT_NAME: TerminusWatchWidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TERMINUS_WATCH
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  TerminusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Terminus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus.tests
        GENERATE_INFOPLIST_FILE: YES
        FIXTURES: $(SRCROOT)/../../fixtures
  TerminusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Terminus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Terminus
  TerminusWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: WatchTests
    dependencies:
      - target: TerminusWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TerminusWatch.app/TerminusWatch
        BUNDLE_LOADER: $(TEST_HOST)
  TerminusWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: TerminusWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.rcn.terminus.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TerminusWatch
schemes:
  Terminus:
    build:
      targets:
        Terminus: all
        TerminusTests: [test]
        TerminusUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets: [TerminusTests, TerminusUITests]
      environmentVariables:
        FIXTURES: $(SRCROOT)/../../fixtures
    archive:
      config: Release
  Terminus Beta:
    build:
      targets:
        Terminus: all
    run:
      config: Beta
    archive:
      config: Beta
  Terminus Watch:
    build:
      targets:
        TerminusWatch: all
        TerminusWatchTests: [test]
        TerminusWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets: [TerminusWatchTests, TerminusWatchUITests]
      environmentVariables:
        FIXTURES: $(SRCROOT)/../../fixtures
