<style>
  /* Any address the website doesn't have (the Worker's sitePage): the sky,

  .lost { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .lost > .wrap { width: 100%; }
  .lost .msg { flex: 1; display: grid; align-content: center; justify-items: start; gap: 12px; padding-top: 32px; padding-bottom: 32px; }

  .lost p { color: var(--muted); max-width: 30rem; font-size: 1.05rem; }
