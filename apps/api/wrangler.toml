name = "nusbus-edge"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "nusbus.rcn.sh", custom_domain = true }]
workers_dev = true


# npx wrangler kv namespace create NUSBUS_KV
# Holds ONLY auth tokens. Never arrivals.
[[kv_namespaces]]
binding = "NUSBUS_KV"
id = "1f88f570f6e04f78aa2888ee7aa78e6a"
preview_id = "1f88f570f6e04f78aa2888ee7aa78e6a"

# Decision + segment-time logging. See the positional schema in analytics.ts.
[[analytics_engine_datasets]]
binding = "NUSBUS_AE"
dataset = "nusbus_edge"

[observability]
enabled = true
