name = "nusbus-edge"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# terminus.rcn.sh is primary; nusbus.rcn.sh stays for installed apps and
# redirects browsers (see oldHostRedirect in src/index.ts).
routes = [
  { pattern = "terminus.rcn.sh", custom_domain = true },
  { pattern = "nusbus.rcn.sh", custom_domain = true },
]

workers_dev = true

# App downloads: /download/android, /download/mac, /download/latest.json.
# Filled by scripts/release.sh.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "terminus-downloads"

# Upstream probe + alert, and expired-session cleanup (src/monitor.ts).
[triggers]
crons = ["*/15 * * * *"]

# The website (apps/web). The Worker runs first so it can redirect the old
# host, then hands anything that isn't an API route to ASSETS.
[assets]
directory = "../web/public"
binding = "ASSETS"
run_worker_first = true


# npx wrangler kv namespace create NUSBUS_KV
# Holds ONLY auth tokens. Never arrivals.
[[kv_namespaces]]
binding = "NUSBUS_KV"
id = "1f88f570f6e04f78aa2888ee7aa78e6a"
preview_id = "1f88f570f6e04f78aa2888ee7aa78e6a"

# Decision + segment-time logging. See the positional schema in analytics.ts.
[[analytics_engine_datasets]]
binding = "NUSBUS_AE"
dataset = "nusbus_edge"

[observability]
enabled = true

# Keep console logs, but not per-request invocation logs: those record the
# full URL, and /next?lat=&lon= would put users' locations in a log.
[observability.logs]
enabled = true
invocation_logs = false

[vars]
EMAIL_FROM = "login@terminus.rcn.sh"
# Public by design; the matching secret is TURNSTILE_SECRET.
TURNSTILE_SITE_KEY = "0x4AAAAAAFHR71tKL907Buou"

# Accounts. Apply schema changes with:
#   npx wrangler d1 migrations apply nusbus --remote
[[d1_databases]]
binding = "DB"
database_name = "nusbus"
database_id = "e0957629-00a9-4984-b6df-a7eba0da47e9"
migrations_dir = "migrations"

# Sign-in links and alerts. terminus.rcn.sh is onboarded under Email Service > Email Sending.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["login@terminus.rcn.sh"]

# Per-IP limit on /auth/login and /pair.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Per IP on /next, /trip, /arrivals, /import.
[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Per account on /me: a widget, the app and a browser tab together.
[[ratelimits]]
name = "RL_ME"
namespace_id = "1003"
simple = { limit = 120, period = 60 }
