packages:
  - apps/api
  - apps/web
allowBuilds:
  esbuild: true
  # Its postinstall only runs `lefthook install`; the root `prepare` script does that.
  lefthook: false
  workerd: true

# Don't install a dependency version published less than three days ago
# (in minutes): a compromised release is usually caught and pulled by then.
minimumReleaseAge: 4320
